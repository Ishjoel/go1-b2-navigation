controller_manager:
  ros__parameters:
    use_sim_time: True
    update_rate: 250  # Hz

    joint_states_controller:
      use_sim_time: True
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_effort_controller:
      use_sim_time: True
      type: joint_trajectory_controller/JointTrajectoryController

joint_group_effort_controller:
  ros__parameters:
    use_sim_time: True
    joints:
        - LF_HAA_joint
        - LF_HFE_joint
        - LF_KFE_joint
        - LH_HAA_joint
        - LH_HFE_joint
        - LH_KFE_joint
        - RF_HAA_joint
        - RF_HFE_joint
        - RF_KFE_joint
        - RH_HAA_joint
        - RH_HFE_joint
        - RH_KFE_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    
    gains:
      LF_HAA_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      LF_HFE_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      LF_KFE_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      LH_HAA_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      LH_HFE_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      LH_KFE_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      RF_HAA_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      RF_HFE_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      RF_KFE_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      RH_HAA_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      RH_HFE_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      RH_KFE_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5}
      
      # {p: 67.5, d: 0.3, i: 0.1.0, i_clamp: 1.0.5}
