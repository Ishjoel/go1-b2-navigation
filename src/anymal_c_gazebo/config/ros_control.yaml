controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 250
    joint_states_controller:
      use_sim_time: true
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_group_position_controller:
      use_sim_time: true
      type: joint_trajectory_controller/JointTrajectoryController
joint_group_position_controller:
  ros__parameters:
    use_sim_time: true
    joints:
    - LF_HAA_joint
    - LF_HFE_joint
    - LF_KFE_joint
    - LH_HAA_joint
    - LH_HFE_joint
    - LH_KFE_joint
    - RF_HAA_joint
    - RF_HFE_joint
    - RF_KFE_joint
    - RH_HAA_joint
    - RH_HFE_joint
    - RH_KFE_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
